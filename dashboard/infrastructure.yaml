version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_collection
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Optional env vars (your Dockerfile already sets these defaults)
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # Optional: basic healthcheck (Dockerfile installs curl)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
