version: '3.9'

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: "ROOTPSWD"
      MYSQL_DATABASE: "audio_air"
      MYSQL_USER: "audio_air"
      MYSQL_PASSWORD: "audio_air_psswd"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
