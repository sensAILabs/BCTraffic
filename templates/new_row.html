{% extends "index.html" %}
{% block body %}
    <div class="card mb-4">
        <div class="card-header">
            {{ experiment.experiment_name }}
        </div>
        <div class="card-body row">

            <div class="col-3">
                <label for="experiment_name" class="form-label"> experiment_name </label>
                <input id="experiment_name" class="form-control col-3" value="{{ experiment.experiment_name }}"
                       disabled>
            </div>
            <div class="col-3">
                <label for="creator_name" class="form-label"> creator_name </label>
                <input id="creator_name" class="form-control col-3" value="{{ experiment.creator_name }}" disabled>
            </div>

            <div class="col-3">
                <label for="sampling_rate" class="form-label"> sampling_rate </label>
                <input id="sampling_rate" class="form-control col-3" value="{{ experiment.sampling_rate }}" disabled>
            </div>

            <div class="col-3">
                <label for="comment" class="form-label"> comment </label>
                <input id="comment" class="form-control col-3" value="{{ experiment.comment }}" disabled>
            </div>

            <div class="col-3">
                <label for="sender_type" class="form-label"> sender_type </label>
                <input id="sender_type" class="form-control col-3" value="{{ experiment.sender_type }}" disabled>
            </div>


        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header rpw">
            <div class="col float-end">

                <button class="btn btn-success" id="run_exp"> Run Experiment</button>
                <div id="seconds"> </div>

            </div>
        </div>
        <div class="card-body ">
            <div class="row mb-2">
                <div class="col-5"><label for="latitude"> latitude</label><input class="form-control"
                                                                                 placeholder="in progress ..."
                                                                                 id="latitude"></div>
                <div class="col-5"><label for="longitude"> longitude</label><input class="form-control"
                                                                                   placeholder="in progress ..."
                                                                                   id="longitude"></div>
                <div class="col-5"><label for="allowed_speed"> allowed_speed</label><input class="form-control"
                                                                                           placeholder="in progress ..."
                                                                                           id="allowed_speed"></div>
                <div class="col-5"><label for="current_speed"> current_speed</label><input class="form-control"
                                                                                           placeholder="in progress ..."
                                                                                           id="current_speed"></div>
                <div class="col-5"><label for="temperature"> temperature °C</label><input class="form-control"
                                                                                          placeholder="in progress ..."
                                                                                          id="temperature"></div>
                <div class="col-5"><label for="humidity"> humidity % </label><input class="form-control"
                                                                                    placeholder="in progress ..."
                                                                                    id="humidity"></div>
                <div class="col-5"><label for="wind_speed"> wind_speed km/h</label><input class="form-control"
                                                                                          placeholder="in progress ..."
                                                                                          id="wind_speed"></div>



            </div>
            <div id="mic">

            </div>
            <div class="row">


                {% for i in counters %}
                    <th>


                        <div class="row mt-2" style="width: 16.6% ; margin-right: 5px ">
                            <label for="{{ i }}">{{ i }}</label>
                            <button onclick="min_fun(`{{ i }}`)" class="btn btn-danger"
                                    style="width: 40% !important;">-
                            </button>
                            <input name="counter" id="{{ i }}" class="form-control" style="width: 20% !important;"
                                   value="0"
                                   type="number">
                            <button onclick="pls_fun(`{{ i }}`)" class=" btn btn-success"
                                    style="width: 40% !important;">+
                            </button>

                        </div>

                    </th>
                {% endfor %}


            </div>

        </div>


    </div>

    <div class="card mb-4">
        <div class="card-header">
            <div class="row">
                <div class="col float-start">
                    <i class="fas fa-table me-1"></i>
                    Experiment rows
                </div>
                <div class="col float-end">
                    <!-- Button trigger modal -->

                </div>
            </div>
        </div>
        <div class="card-body">

            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Start Time</th>
                    <th scope="col">End Time</th>
                    <th scope="col">Location</th>
                    <th scope="col">Humidity</th>
                    <th scope="col">Wind Speed</th>
                    <th scope="col">Temperature</th>

                    {% for i in counters %}
                        <th scope="col">
                            {{ i }}
                        </th>
                    {% endfor %}
                </tr>
                </thead>
                <tbody id="row_tbud">

                </tbody>
            </table>


        </div>
    </div>



{% endblock %}


{% block addonJs %}


    <script>
        var start_time

        function pls_fun(input_id) {
            input = document.getElementById(input_id)
            input.value = parseInt(input.value) + 1
        }

        function min_fun(input_id) {
            input = document.getElementById(input_id)
            if (input.value > 0) {
                input.value = parseInt(input.value) - 1
            }

        }


        function update_status() {
            navigator.geolocation.getCurrentPosition((position) => {
                let lat = position.coords.latitude.toFixed(2);
                let long = position.coords.longitude.toFixed(2);
                $('#latitude').val(lat)
                $('#longitude').val(long)
                const weather_api = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${long}&current=temperature_2m,wind_speed_10m,relative_humidity_2m`
                $.get(weather_api, function (res) {
                    console.log(res)
                    $('#temperature').val(res.current.temperature_2m)
                    $('#wind_speed').val(res.current.wind_speed_10m)
                    $('#humidity').val(res.current.relative_humidity_2m)
                }).fail(function (err) {
                    alert("Error in console")
                    console.log(err)
                })
                console.log("status updated")
            });
        }

        update_status()
        setInterval(function () {
            update_status();
        }, 120000)


        let mediaRecorder;
        const stream = navigator.mediaDevices.getUserMedia({audio: true});
        stream.then((r) => {
            mediaRecorder = new MediaRecorder(r);
            mediaRecorder.ondataavailable = async (event) => {
                if (event.data.size > 0) {
                    await sendAudioData(event.data);
                }
            };
        })


        async function startRecording() {
            console.log("start rec")
            start_time = Date.now()

            setInterval(function () {
                $('#seconds').html(`${Date.now() - start_time} ms`)
            },500)

            try {

                mediaRecorder.start(9000);
            } catch (error) {
                alert(error)
            }
        }

        async function sendAudioData(audioBlob) {
            console.log("send")
            values = []
            values_temp = {}
            $('input[name=counter]').each((i, v) => {
                values_temp[v.id] = $(v).val()
                values.push({
                    "counter_type": v.id,
                    "count": $(v).val()
                })
            })


            req = {
                latitude: $('#latitude').val(),
                longitude: $('#longitude').val(),
                allowed_speed: 0,
                current_speed: 0,
                temperature: $('#temperature').val(),
                humidity: $('#humidity').val(),
                "start_time": start_time,
                "end_time": Date.now(),
                counters: values,
                wind_speed: $('#wind_speed').val(),
            }

            start_time = req.end_time

            console.log(req)


            let tbody = ` <tr>
                <th> </th>
                <th>${new Date(req.start_time * 1000)}  </th>
                <th>${new Date(req.end_time * 1000)}</th>
                <th>${req.latitude} , ${req.longitude}</th>
                <th>${req.humidity}</th>
                <th>${req.wind_speed}</th>
                <th>${req.temperature}</th>
              `


            values.map((i, v) => {
                console.log(i, v)
                tbody += `<th> ${i.count} </th>`
            })

            tbody += "</tr>"

            $('#row_tbud').append(tbody)

        }


        document.getElementById('run_exp').addEventListener('click', startRecording)
    </script>



    <script type="module">
        import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.esm.js'
        import RecordPlugin from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/plugins/record.esm.js'

        let wavesurfer
        var record

        wavesurfer = WaveSurfer.create({
            container: '#mic',
            waveColor: '#4F4A85',
            progressColor: '#383351',
        })
        record = wavesurfer.registerPlugin(RecordPlugin.create({scrollingWaveform: false, renderRecordedAudio: false}))

        record.startRecording()

    </script>



{% endblock %}
